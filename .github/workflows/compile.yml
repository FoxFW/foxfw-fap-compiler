name: Compile FAP — FoxFW2.0

# This workflow is triggered remotely (workflow_dispatch) on THIS repo by
# the Cloudflare Worker in worker/ — visitors to the FoxFW FAP Compiler web
# page never fork this repo or see a GitHub login prompt. The Worker holds
# one FoxFW-owned token server-side and dispatches this workflow directly;
# see worker/index.js and README.md for the full flow.
#
# ufbt-based (fast path): downloads FoxFW2.0's own published SDK bundle via
# https://foxfw.github.io/fox-web/directory.json instead of checking out and
# building the whole firmware from source on every compile. Requires
# FoxFW2.0's publish-sdk-index.yml to have run at least once (it has, as of
# 2026-08-07) and to be kept up to date on every FoxFW2.0 release so this
# stays in sync with the current firmware SDK.
#
# The old full-fbt-build workflow (checks out and compiles all of FoxFW2.0
# from source per request — much slower, but has no dependency on the SDK
# index) is kept as a fallback at compile-fbt.yml.example. If the SDK index
# ever goes stale or down, swap it back in the same way this one went in.

on:
  workflow_dispatch:
    inputs:
      repo_url:
        description: "GitHub repo URL of the app to compile"
        required: true
      ref:
        description: "Branch / tag / commit of the app repo (blank = default branch)"
        required: false
        default: ""
      subdir:
        description: "Path inside the app repo to the folder containing application.fam (blank = repo root)"
        required: false
        default: ""

env:
  FOXFW_SDK_INDEX_URL: https://foxfw.github.io/fox-web/directory.json
  FOXFW_SDK_CHANNEL: release

jobs:
  compile:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Parse target repo owner/name
        id: parse
        run: |
          set -e
          URL="${{ inputs.repo_url }}"
          URL="${URL%.git}"
          URL="${URL%/}"
          OWNER_REPO="$(echo "$URL" | sed -E 's#^(https?://)?(www\.)?github\.com/##')"
          if [[ ! "$OWNER_REPO" =~ ^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$ ]]; then
            echo "::error::Could not parse a github.com owner/repo out of '${{ inputs.repo_url }}'."
            exit 1
          fi
          echo "owner_repo=$OWNER_REPO" >> "$GITHUB_OUTPUT"

      - name: Checkout target app
        uses: actions/checkout@v4
        with:
          repository: ${{ steps.parse.outputs.owner_repo }}
          ref: ${{ inputs.ref }}
          fetch-depth: 1

      - name: Resolve app subdirectory + appid
        id: app
        run: |
          set -e
          APP_DIR="${{ inputs.subdir }}"
          APP_DIR="${APP_DIR%/}"
          [ -z "$APP_DIR" ] && APP_DIR="."
          FAM_FILE="$APP_DIR/application.fam"
          if [ ! -f "$FAM_FILE" ]; then
            echo "::error::No application.fam at $FAM_FILE. Multi-app repo? Set the 'subdir' input."
            exit 1
          fi
          APPID="$(grep -oE 'appid[[:space:]]*=[[:space:]]*"[^"]+"' "$FAM_FILE" | head -1 | sed -E 's/.*"([^"]+)".*/\1/')"
          echo "app_dir=$APP_DIR" >> "$GITHUB_OUTPUT"
          echo "appid=$APPID" >> "$GITHUB_OUTPUT"

      - name: Build with ufbt against FoxFW v2.1 SDK
        id: build
        uses: flipperdevices/flipperzero-ufbt-action@v0.1
        with:
          app-dir: ${{ steps.app.outputs.app_dir }}
          sdk-channel: ${{ env.FOXFW_SDK_CHANNEL }}
          sdk-index-url: ${{ env.FOXFW_SDK_INDEX_URL }}

      - name: Upload .fap artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.app.outputs.appid }}-foxfw2.0-fap
          path: ${{ steps.build.outputs.fap-artifacts }}
          retention-days: 7
